<div class="shell">
  <div class="app-topbar">
    <header class="app-header">
      <span class="app-header__brand">Mensa Scolastica</span>

      <div class="app-header__user">
        @if (currentUser(); as user) {
          <span class="app-header__email" [title]="user.email ?? ''">{{ user.email }}</span>
          <button type="button" class="btn btn-secondary" (click)="logout()">Esci</button>
        }
      </div>
    </header>

    @if (navLinks().length > 0) {
      <nav class="app-nav">
        @for (link of navLinks(); track link.path) {
          <a [routerLink]="link.path" routerLinkActive="app-nav__link--active" class="app-nav__link">
            {{ link.label }}
          </a>
        }
      </nav>
    }
  </div>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
