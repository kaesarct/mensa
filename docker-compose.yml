services:
  firebase:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: firebase
    command: sh -c "npm run build:functions && npx firebase-tools emulators:start --only auth,firestore,functions,pubsub,storage 2>&1 | tee /tmp/emulators.log"
    ports:
      - "4000:4000" # Emulator UI
      - "9099:9099" # Auth
      - "8080:8080" # Firestore
      - "5001:5001" # Functions
      - "8085:8085" # Pub/Sub
      - "9199:9199" # Storage
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      # Controllare solo le porte TCP non basta: gli emulatori Firebase fanno
      # un bind di prova (per verificare che la porta sia libera) e poi la
      # rilasciano prima di aprirla per davvero — un connect riuscito in quella
      # finestra dà un falso "healthy" (visto con seed che falliva con
      # ECONNREFUSED subito dopo). Si cerca quindi la riga di log ufficiale
      # "All emulators ready", scritta una sola volta a inizializzazione
      # completata di tutti gli emulatori.
      test: ["CMD", "grep", "-q", "All emulators ready", "/tmp/emulators.log"]
      interval: 5s
      timeout: 3s
      retries: 60

  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    command: npm run seed
    environment:
      FIRESTORE_EMULATOR_HOST: firebase:8080
      FIREBASE_AUTH_EMULATOR_HOST: firebase:9099
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      firebase:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    working_dir: /app/web
    # --poll: i bind mount Docker su Windows/macOS non propagano sempre gli
    # eventi inotify al file watcher di Vite/Angular, quindi le modifiche fatte
    # sull'host non triggerano un rebuild senza polling esplicito.
    command: npx ng serve --host 0.0.0.0 --port 4200 --poll 1000
    ports:
      - "4200:4200"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      firebase:
        condition: service_healthy

volumes:
  node_modules:
